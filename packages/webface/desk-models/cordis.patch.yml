# @webface/dsh-desk-models — the webfaCe Desk model layer, applied after
# dsh-base (and dsh-web-app) by profile order. A patch replaces the targeted
# row's whole `config`, so every row below restates every key it owns.
#
# Routes:
#   openrouter — the customer's own OpenRouter key (OPENROUTER_API_KEY). One
#                key reaches DeepSeek, GLM (z-ai), Kimi (moonshotai), Qwen,
#                Anthropic and OpenAI. Model ids are OpenRouter ids.
#   sovereign  — the private gateway on our own hardware (opt-in tier).
#                Declared here; it only fails when selected without a key.
#
# Context windows are pinned to 262144 on purpose: it bounds compaction and
# cost per turn. Raise per model when a job genuinely needs more.

- id: llm-pi-ai
  config:
    providers:
      openrouter:
        displayName: OpenRouter
        apiKeyEnv: OPENROUTER_API_KEY
        api: openai-completions
        baseURL: https://openrouter.ai/api/v1
        models:
          - id: deepseek/deepseek-v4-pro
            name: DeepSeek V4 Pro
            contextWindow: 262144
            maxTokens: 32768
            reasoningEfforts:
              off:
              low: low
              high: high
          - id: deepseek/deepseek-v4-flash
            name: DeepSeek V4 Flash (fast, cheap)
            contextWindow: 262144
            maxTokens: 32768
            reasoningEfforts:
              off:
              low: low
              high: high
          - id: z-ai/glm-5.3
            name: GLM 5.3
            contextWindow: 262144
            maxTokens: 32768
            reasoningEfforts:
              off:
              low: low
              high: high
          - id: z-ai/glm-5.3-flash
            name: GLM 5.3 Flash (vision)
            contextWindow: 262144
            maxTokens: 32768
            input: [ text, image ]
          - id: moonshotai/kimi-k3
            name: Kimi K3 (vision)
            contextWindow: 262144
            maxTokens: 32768
            input: [ text, image ]
            reasoningEfforts:
              off:
              low: low
              high: high
          - id: moonshotai/kimi-k2.7-code
            name: Kimi K2.7 Code
            contextWindow: 262144
            maxTokens: 32768
            input: [ text, image ]
          - id: qwen/qwen3.8-27b
            name: Qwen3.8 27B (vision)
            contextWindow: 262144
            maxTokens: 32768
            input: [ text, image ]
          - id: qwen/qwen3.8-max
            name: Qwen3.8 Max (vision)
            contextWindow: 262144
            maxTokens: 32768
            input: [ text, image ]
            reasoningEfforts:
              off:
              low: low
              high: high
          - id: anthropic/claude-sonnet-5
            name: Claude Sonnet 5 (via OpenRouter)
            contextWindow: 262144
            maxTokens: 32768
            input: [ text, image ]
            reasoningEfforts:
              off:
              low: low
              high: high
          - id: anthropic/claude-opus-5
            name: Claude Opus 5 (via OpenRouter)
            contextWindow: 262144
            maxTokens: 32768
            input: [ text, image ]
            reasoningEfforts:
              off:
              low: low
              high: high
          - id: openai/gpt-5.6-luna
            name: GPT-5.6 Luna (via OpenRouter)
            contextWindow: 262144
            maxTokens: 32768
            input: [ text, image ]
            reasoningEfforts:
              off:
              low: low
              high: high
      # Only offered when the box is told where its private gateway is; there is no default host.
      sovereign:
        displayName: Private gateway
        apiKeyEnv: SOVEREIGN_GATEWAY_KEY
        api: openai-completions
        baseURL: !!js process.env.SOVEREIGN_GATEWAY_URL ?? 'https://gateway.invalid/v1'
        models:
          - id: sovereign-default
            name: Private · fast agentic
            contextWindow: 262144
            maxTokens: 32768
          - id: qwen38
            name: Private · Qwen3.8-27B (vision)
            contextWindow: 262144
            maxTokens: 32768
            input: [ text, image ]

# DeepSeek's own API route is not offered on Desk (no key on a box; every
# model goes through the customer's OpenRouter key or the private gateway).
- id: llm-deepseek
  disabled: true

- id: agent-default-model
  config:
    provider: openrouter
    model: deepseek/deepseek-v4-pro

# Telemetry is disabled outright — not env-driven. The upstream default
# exporter points at deepseeksvc.com; a customer's Desk must never be one
# environment variable away from shipping session logs there.
- id: session-telemetry-otel
  config:
    mode: DISABLED
    shutdownTimeoutMillis: 3000
    exporter:
      url: http://127.0.0.1:1/disabled
      compression: gzip
      timeoutMillis: 1000
    processor:
      scheduledDelayMillis: 10000
      maxQueueSize: 2048
      maxExportBatchSize: 2048
      exportTimeoutMillis: 1500

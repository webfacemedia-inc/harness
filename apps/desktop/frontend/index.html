<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>webfaCe Desk</title>
<style>
:root{color-scheme:light dark;--bg:#fafafa;--card:#fff;--ink:#111111;--mute:#6b6b6b;--line:#e4e4e4;--blue:#3499cc;--deep:#1f6f99}
@media(prefers-color-scheme:dark){:root{--bg:#070707;--card:#141414;--ink:#f2f2f2;--mute:#a3a3a3;--line:#282828}}
html,body{height:100%;margin:0}body{background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,"Segoe UI",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#setup{min-height:100%;display:grid;place-items:center;padding:24px}.card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px}
.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:600;margin-bottom:6px}.brand svg{width:30px;height:31px;color:var(--blue)}.brand .wm em{font-style:normal;font-family:Fraunces,Georgia,serif;font-weight:600;font-size:1.1em;color:var(--blue-deep,#1f6f99);margin-left:.22em}
p{margin:0 0 18px;color:var(--mute)}label{display:block;font-weight:600;font-size:13px;margin:12px 0 6px}input{width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:transparent;color:inherit;font:inherit}
button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:10px;background:var(--blue);color:#fff;font:inherit;font-weight:600;cursor:pointer}button:hover{background:var(--deep)}
.err{color:#b42318;font-size:14px;margin-top:10px;min-height:20px}
#app{position:fixed;inset:0;pointer-events:none}#app a{pointer-events:auto}
#bar{position:fixed;top:8px;right:8px;z-index:2;display:flex;gap:6px}#bar button,#bar a{width:auto;margin:0;padding:6px 10px;font-size:12px;background:rgba(21,32,41,.65);color:#fff;border-radius:8px;text-decoration:none}#bar a{background:#1f6f99}#note{position:fixed;left:0;right:0;bottom:0;z-index:3;padding:10px 14px;background:#fff7e6;color:#5a4200;border-top:1px solid #f0d9a6;font-size:13px;display:none}
</style></head>
<body>
<div id="setup"><form class="card" id="f">
<div class="brand"><svg viewBox="0 0 171.28 177.92" aria-hidden="true"><path fill="currentColor" d="M170.38,128.74l.45-.99.36-.72v-.77l.09-.52-.2-.97-.29-.81-.49-.77-.45-.67-46.66-64.72-.23-.36,37.44-22.82.95-2.83-.29-.45-.14-.22v-.14l-.65-.77-.58-.83-.68-.74-.45-.52-.32-.38-.81-.9-.31-.29-.14-.16h0l-.43-.43-.99-.9-2.31-2.56-2.31-2.23-2.54-2.16-2.54-2.11-.9-.67-.9-.45-.9-.29h-1.78l-.92.22-.9.38-.74.67-52.22,33.35-1.33-.38,19.02-40.59-.4-2.7-1.53-1.04-1.66-.81-1.93-.83-2-.67-2.32-.68-2.38-.52-2.61-.52-2.76-.38-1.71-.07-.74.23-.67.36-.67.38-.52.67-.45.88-.38.97-.14.45-34.02,80.01-.38.31-.36.43-.52.31-.67.43-36.48-18.08-2.9.38-.43.68-.27.88-.76,1.94-.88,2.32-.79,2.79-.95,3.6-.83,3.37-.65,3.06-.4,2.92-.14,1.01v.95l.22.9.4.9.43.68.76.61.79.61.97.5.16.09.67.36,1.04.52,1.57.83,1.8.97,2.45,1.26,2.76,1.42,3.26,1.8,1.8.83,1.8.97,1.93.95,2.16,1.13,4.47,2.32,4.99,2.61,5.28,2.77,2.83,1.4,3.06,1.58,6.18,3.21,6.77,3.6.14,1.49-44.26,3.71-2.11,1.8-.13,1.64v1.8l.23,2.03.36,2.16.54,2.16.74,2.47.83,2.54,1.1,2.77.31.74.52.67.5.54.77.36.67.23.88.16h2.09l78.41-10.5,2.81,1.49.74,33.19.97.97.99,1.35.58-.09h.81l.9-.16,1.12-.14,1.12-.31,1.33-.31,1.42-.36,1.57-.31,3.6-1.04,1.8-.45,1.62-.45,1.51-.52,1.4-.43,2.67-.9.97-.61.38-.29.43-.22.31-.38.38-.31.29-.36.31-.31.14-.45v-.22h0l.14-.16v-.45l.14-.38v-1.93l-2.72-62.11,1.19-.97,25.34,36.63,2.59,1.13,1.26-.85,1.51-.95,1.46-1.28,1.66-1.35,1.64-1.64,1.8-1.8,1.8-2.09,2.02-2.18.14-.22.11.02Z"/></svg><span class="wm">webfaCe<em>Desk</em></span></div>
<p>Enter your Desk's address — it's in your welcome email, like <code>yourname.webfacedesk.app</code>. To switch Desks later: Desk menu → Change Desk (⌘⇧D / Ctrl+Shift+D).</p>
<label for="h">Desk address</label><input id="h" placeholder="yourname.webfacedesk.app" autocomplete="off" spellcheck="false" aria-describedby="e">
<button type="submit">Open my Desk</button><div class="err" id="e" role="alert"></div>
</form></div>
<div id="app"><div id="bar"><a id="update" href="https://webfacedesk.app/download" target="_blank" rel="noreferrer" style="display:none">Update</a></div></div>
<div id="note"></div>
<script>
const KEY = 'desk.host'
const f = document.getElementById('f'), h = document.getElementById('h'), e = document.getElementById('e')
// The Desk is opened top-level (not in a frame): its cookies, notifications and sign-in behave exactly as in a browser. Desk → Change Desk (⌘⇧D) brings this screen back.
const show = host => { document.title = 'webfaCe Desk — ' + host; location.href = 'https://' + host + '/' }
const probe = async host => { // deskd answers "ok" on /healthz (CORS-open); any other host fails here
  try { const r = await fetch('https://' + host + '/healthz', { mode: 'cors', cache: 'no-store' }); return r.ok && (await r.text()).trim() === 'ok' } catch { return false }
}
const fail = host => { e.textContent = 'No Desk answered at ' + host + '. Check the address in your welcome email.' }
f.addEventListener('submit', async ev => {
  ev.preventDefault(); e.textContent = ''
  let host = h.value.trim().replace(/^https?:\/\//, '').replace(/\/.*$/, '')
  if (!host) return
  if (!host.includes('.')) host += '.webfacedesk.app'
  if (await probe(host)) { localStorage.setItem(KEY, host); show(host) } else fail(host)
})
const change = () => { localStorage.removeItem(KEY); location.reload() }
window.runtime?.EventsOn?.('desk:change', change)
window.runtime?.EventsOn?.('desk:translocated', () => { const n = document.getElementById('note'); n.textContent = 'Move webfaCe Desk to your Applications folder, then open it from there — that stops macOS asking about it every time.'; n.style.display = 'block' })
// Update check: the GitHub release tag against this build's version.
const updateCheck = (async () => { try { const mine = await window.go?.main?.App?.Version?.(); if (!mine || mine === 'dev') return false
  const r = await fetch('https://api.github.com/repos/webfacemedia-inc/harness/releases/latest', { headers: { accept: 'application/vnd.github+json' } }); const latest = String((await r.json()).tag_name || '').replace(/^desktop-v/, '')
  if (latest && latest !== mine) { document.getElementById('update').style.display = 'inline-block'; return true }
  return false } catch { return false } })()
const saved = localStorage.getItem(KEY)
;(async () => {
  const changing = await (window.go?.main?.App?.ChangeRequested?.() ?? Promise.resolve(false))
  if (!saved) return
  h.value = saved
  if (changing) return
  // An available update holds the auto-open for one launch: otherwise the
  // Desk takes over instantly and the Update chip is never reachable. The
  // check gets 1.5s; offline or on-time, the Desk opens as always.
  const holdForUpdate = await Promise.race([updateCheck, new Promise(res => setTimeout(() => res(false), 1500))])
  probe(saved).then(ok => { if (!ok) fail(saved); else if (!holdForUpdate) show(saved)
    else tell('A new version of the app is ready — Update (top right) installs it and restarts. Or just Open my Desk to carry on.') })
})()
// Self-update: the chip runs it in place — download, verify, swap, relaunch.
// The link only navigates as a fallback, when the app says an in-place update
// can't work here (dev build, running from Downloads, unwritable folder).
const up = document.getElementById('update'), note = document.getElementById('note')
const tell = msg => { note.textContent = msg; note.style.display = msg ? 'block' : 'none' }
window.runtime?.EventsOn?.('desk:update', s => { up.textContent = { checking: 'Checking…', downloading: 'Downloading…', verifying: 'Verifying…', installing: 'Installing…', restarting: 'Restarting…' }[s] || s })
up.addEventListener('click', async ev => {
  if (up.dataset.manual) return // fall through to the download page
  ev.preventDefault()
  if (up.dataset.busy) return
  up.dataset.busy = '1'; tell('')
  const done = await (window.go?.main?.App?.Update?.() ?? Promise.resolve('manual'))
  delete up.dataset.busy
  if (done === 'restarting') return // the new build takes it from here
  up.textContent = 'Update'
  if (done === 'current') { up.style.display = 'none'; return }
  up.dataset.manual = '1'
  if (done === 'manual') tell('This copy can’t update itself in place — the Update button now opens the download page. (If the app is running from Downloads, move it to Applications first.)')
  else tell(done + ' — the Update button now opens the download page instead.')
})
</script>
</body></html>

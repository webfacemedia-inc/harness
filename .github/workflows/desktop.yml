name: desktop
on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin/universal
            artifact: webfaCe-Desk-macOS
          - os: windows-latest
            platform: windows/amd64
            artifact: webfaCe-Desk-Windows
          - os: ubuntu-22.04
            platform: linux/amd64
            artifact: webfaCe-Desk-Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
      - run: wails build -platform ${{ matrix.platform }} -clean
        working-directory: apps/desktop
      - if: runner.os == 'macOS'
        run: codesign --force --deep --sign - "apps/desktop/build/bin/webfaCe Desk.app"
      # Zip on the build runner: upload-artifact drops executable bits and
      # symlinks, which leaves the macOS bundle "damaged" and the Linux binary
      # non-executable. The release job only forwards the bytes.
      - if: runner.os == 'macOS'
        run: cd apps/desktop/build/bin && ditto -c -k --keepParent "webfaCe Desk.app" "${{ matrix.artifact }}.zip"
      - if: runner.os == 'Linux'
        run: cd apps/desktop/build/bin && chmod +x * && zip -r "${{ matrix.artifact }}.zip" . -x "*.zip"
      - if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "apps/desktop/build/bin/*" -DestinationPath "apps/desktop/build/bin/${{ matrix.artifact }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: apps/desktop/build/bin/${{ matrix.artifact }}.zip
          if-no-files-found: error
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip

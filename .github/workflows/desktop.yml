name: desktop
on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin/universal
            artifact: webfaCe-Desk-macOS
          - os: windows-latest
            platform: windows/amd64
            artifact: webfaCe-Desk-Windows
          - os: ubuntu-22.04
            platform: linux/amd64
            artifact: webfaCe-Desk-Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
      - run: wails build -platform ${{ matrix.platform }} -clean
        working-directory: apps/desktop
      - if: runner.os == 'macOS'
        run: codesign --force --deep --sign - "apps/desktop/build/bin/webfaCe Desk.app"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: apps/desktop/build/bin/
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - run: |
          cd dist && for d in *; do (cd "$d" && zip -r "../$d.zip" .); done && ls -la
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
